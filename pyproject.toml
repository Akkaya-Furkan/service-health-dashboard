[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "service-health-dashboard"
version = "0.1.0"
description = "Read-only service health dashboard backend: container status, HTTP uptime, Prometheus metrics"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "prometheus_client>=0.20",
    "docker>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shd = "shd.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
